name: OpenAPI contract check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Check candidate OpenAPI document
        run: npm run contract:check -- --base openapi/base.json --candidate openapi/candidate.json
