[workspace]
resolver = "3"
members = ["crates/domain", "crates/store", "crates/http", "crates/cli"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/codebyjuliamendes/specsentry"
publish = false

[workspace.dependencies]
specsentry-domain = { path = "crates/domain" }
specsentry-store = { path = "crates/store" }
specsentry-http = { path = "crates/http" }

anyhow = "1.0.100"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "tracing"] }
clap = { version = "4.6", features = ["derive", "env"] }
http-body-util = "0.1.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit", "set-header", "timeout", "request-id", "compression-gzip", "catch-panic", "util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json", "env-filter", "fmt"] }

assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
